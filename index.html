<!DOCTYPE html>

    <title>Ejercicios de Colores y Gradiente</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <h2>Ejercicio 1: Aplicación de Colores</h2>
    <div class="contenedor">
        <div class="caja color-nombre">Nombre</div>
        <div class="caja color-hex">Hex</div>
        <div class="caja color-rgb">RGB</div>
        <div class="caja color-rgba">RGBA</div>

    <h2>Ejercicio 2: Gradiente Lineal</h2>
    <div class="contenedor-gradiente">
        Gradiente de azul a naranja
    </div>

<h2>Ejercicio 4: Prueba de Transparencia</h2>
<div class="caja-transparente">
    Caja con RGBA
</div>

<!-- Ejercicio 5: Hexadecimal vs RGB (cajas independientes) -->
    <h2>Ejercicio 5: Hexadecimal vs RGB</h2>
    <div class="caja-hex">#1E90FF</div>
    <div class="caja-rgb">rgb(30,144,255)</div>
